services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kaiju
      POSTGRES_PASSWORD: kaiju
      POSTGRES_DB: kaiju
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaiju"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
